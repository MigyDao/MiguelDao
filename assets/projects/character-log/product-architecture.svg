<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Character Log local-first product architecture</title>
  <desc id="desc">A public-safe architecture view showing the Character Log desktop interface, Tauri shell, SQLite local data, portable character files and verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b4c"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f4f0e8"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#315b4c" letter-spacing="2">AI-ENABLED PRODUCT WORK</text>
  <text x="70" y="122" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#14261f">Character Log — local-first by design</text>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="18" fill="#5b6963">Public-safe architecture view — no personal character data</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="220" width="300" height="300" rx="28" fill="#17382d"/>
    <text x="240" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#b8d3c8" letter-spacing="1.5">DESKTOP PRODUCT</text>
    <text x="240" y="320" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">Character Log</text>
    <text x="240" y="356" text-anchor="middle" font-size="16" fill="#d8e4df">multiple characters</text>
    <text x="240" y="384" text-anchor="middle" font-size="16" fill="#d8e4df">stats · quests · records</text>
    <text x="240" y="412" text-anchor="middle" font-size="16" fill="#d8e4df">Chronicle · Save States</text>
    <rect x="145" y="448" width="190" height="42" rx="21" fill="#2d5848"/>
    <text x="240" y="475" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">offline · local data</text>

    <rect x="470" y="220" width="250" height="125" rx="22" fill="#ffffff" stroke="#c9d2ce" stroke-width="2"/>
    <text x="595" y="270" text-anchor="middle" font-size="23" font-weight="800" fill="#14261f">Tauri 2 shell</text>
    <text x="595" y="304" text-anchor="middle" font-size="15" fill="#5b6963">HTML · CSS · JavaScript</text>

    <rect x="470" y="395" width="250" height="125" rx="22" fill="#ffffff" stroke="#c9d2ce" stroke-width="2"/>
    <text x="595" y="445" text-anchor="middle" font-size="23" font-weight="800" fill="#14261f">SQLite</text>
    <text x="595" y="479" text-anchor="middle" font-size="15" fill="#5b6963">persistent local records</text>

    <rect x="805" y="220" width="300" height="125" rx="22" fill="#ffffff" stroke="#c9d2ce" stroke-width="2"/>
    <text x="955" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#14261f">Portable files</text>
    <text x="955" y="303" text-anchor="middle" font-size="15" fill="#5b6963">import · export · user-owned data</text>

    <rect x="805" y="395" width="300" height="125" rx="22" fill="#ffffff" stroke="#c9d2ce" stroke-width="2"/>
    <text x="955" y="445" text-anchor="middle" font-size="22" font-weight="800" fill="#14261f">Verification</text>
    <text x="955" y="478" text-anchor="middle" font-size="15" fill="#5b6963">acceptance criteria · automated checks</text>
  </g>

  <g stroke="#315b4c" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M390 300 H470"/>
    <path d="M595 345 V395"/>
    <path d="M720 282 H805"/>
    <path d="M720 458 H805"/>
  </g>

  <text x="70" y="640" font-family="Arial, sans-serif" font-size="17" fill="#5b6963">Development used AI as an implementation partner; product scope, architecture, acceptance criteria and review remained human-directed.</text>
  <text x="70" y="670" font-family="Arial, sans-serif" font-size="17" fill="#5b6963">Release boundary: Windows beta candidate built; broader clean-machine and macOS validation remain separate gates.</text>
</svg>