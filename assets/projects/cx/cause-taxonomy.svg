<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Quality analytics cause taxonomy</title>
  <desc id="desc">Eight possible cause categories used before choosing an intervention: person, knowledge, process, tools, information, work design, case complexity, and the quality measurement system.</desc>
  <rect width="1400" height="820" fill="#f5f2e9"/>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#315c4b" letter-spacing="2">DIAGNOSE BEFORE YOU COACH</text>
  <text x="72" y="132" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#10231c">The same symptom can have different causes</text>
  <text x="72" y="170" font-family="Arial, sans-serif" font-size="18" fill="#43524c">Use the cause category to choose the response — not the other way around.</text>

  <g font-family="Arial, sans-serif">
    <g><rect x="75" y="235" width="285" height="135" rx="22" fill="#183d31"/><text x="105" y="282" font-size="20" font-weight="800" fill="#fff">Person / execution</text><text x="105" y="316" font-size="15" fill="#dce8df">Knowledge and process are sound;</text><text x="105" y="340" font-size="15" fill="#dce8df">execution is inconsistent.</text></g>
    <g><rect x="390" y="235" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="420" y="282" font-size="20" font-weight="800" fill="#10231c">Knowledge / training</text><text x="420" y="316" font-size="15" fill="#43524c">The correct approach is not yet</text><text x="420" y="340" font-size="15" fill="#43524c">understood or retained.</text></g>
    <g><rect x="705" y="235" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="735" y="282" font-size="20" font-weight="800" fill="#10231c">Process / policy</text><text x="735" y="316" font-size="15" fill="#43524c">The expected workflow itself creates</text><text x="735" y="340" font-size="15" fill="#43524c">friction, ambiguity or poor outcomes.</text></g>
    <g><rect x="1020" y="235" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="1050" y="282" font-size="20" font-weight="800" fill="#10231c">Tools / technology</text><text x="1050" y="316" font-size="15" fill="#43524c">Systems, access, interfaces or latency</text><text x="1050" y="340" font-size="15" fill="#43524c">make correct action difficult.</text></g>

    <g><rect x="75" y="410" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="105" y="457" font-size="20" font-weight="800" fill="#10231c">Information / docs</text><text x="105" y="491" font-size="15" fill="#43524c">Reference material is missing, stale,</text><text x="105" y="515" font-size="15" fill="#43524c">contradictory or hard to find.</text></g>
    <g><rect x="390" y="410" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="420" y="457" font-size="20" font-weight="800" fill="#10231c">Work design / environment</text><text x="420" y="491" font-size="15" fill="#43524c">Volume, staffing, handoffs, targets or</text><text x="420" y="515" font-size="15" fill="#43524c">interruptions shape the error.</text></g>
    <g><rect x="705" y="410" width="285" height="135" rx="22" fill="#fffefa" stroke="#cfc8b8" stroke-width="2"/><text x="735" y="457" font-size="20" font-weight="800" fill="#10231c">Case complexity</text><text x="735" y="491" font-size="15" fill="#43524c">The situation legitimately exceeds</text><text x="735" y="515" font-size="15" fill="#43524c">ordinary handling.</text></g>
    <g><rect x="1020" y="410" width="285" height="135" rx="22" fill="#315c4b"/><text x="1050" y="457" font-size="20" font-weight="800" fill="#fff">QA system / measurement</text><text x="1050" y="491" font-size="15" fill="#e6efe9">Sampling, criteria, weighting, drift or</text><text x="1050" y="515" font-size="15" fill="#e6efe9">automation may distort the finding.</text></g>

    <rect x="75" y="615" width="1230" height="110" rx="22" fill="#e9e4d6"/>
    <text x="105" y="660" font-size="20" font-weight="800" fill="#10231c">Intervention rule</text>
    <text x="105" y="695" font-size="17" fill="#43524c">Coach execution problems. Teach knowledge gaps. Repair documentation. Redesign broken processes or tools. Recalibrate a flawed QA system.</text>
  </g>
</svg>